name: Snake Legends CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build backend image
      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/snake-legends-backend:${{ github.sha }} \
            ./backend

      # 4. Build frontend image
      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/snake-legends-frontend:${{ github.sha }} \
            ./frontend

      # 5. Push backend image
      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/snake-legends-backend:${{ github.sha }}

      # 6. Push frontend image
      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/snake-legends-frontend:${{ github.sha }}

      # 7. Connect to EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/snake-legends-fullstack

            git pull origin main

            kubectl set image deployment/backend \
              backend=${{ secrets.DOCKER_USERNAME }}/snake-legends-backend:${{ github.sha }} \
              -n snake-legends

            kubectl set image deployment/frontend \
              frontend=${{ secrets.DOCKER_USERNAME }}/snake-legends-frontend:${{ github.sha }} \
              -n snake-legends

            kubectl rollout status deployment/backend -n snake-legends
            kubectl rollout status deployment/frontend -n snake-legends

            kubectl get pods -n snake-legends